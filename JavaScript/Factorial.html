<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор факториала</title>
</head>
<body>
<h3>Введи число</h3>
<input id="user-input" type="text" placeholder="число">

<button id="submit">Посчитать</button>

<p id="result"></p>

<script>
    const inputEl = document.getElementById('user-input');
    const buttonEl = document.getElementById('submit');
    const resultEl = document.getElementById('result');

    let userIn = inputEl.value.trim();
    if (userIn === '') {
        resultEl.textContent = 'Введите число'
    }

    buttonEl.addEventListener('click', () => {
        let userIn = inputEl.value.trim();
        if (userIn === '') {
            resultEl.textContent = 'Введите число'
        }
        resultEl.textContent = factorial(userIn);
    })

    function factorial(n) {
        if (n === 0 || n === 1) {
            return 1
        }
        return n * factorial(n - 1);
    }
</script>
</body>
</html>
